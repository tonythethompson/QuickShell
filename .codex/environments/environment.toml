# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Quick Shell"

[setup]
script = '''
set -euo pipefail

dotnet --info

# Restore .NET dependencies. Full build may require Windows/MSBuild.
dotnet restore QuickShell.sln

if [ -d QuickShell.Raycast ]; then
  cd QuickShell.Raycast
  node --version
  npm ci
fi'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

$source = if ($env:CODEX_SOURCE_TREE_PATH) { $env:CODEX_SOURCE_TREE_PATH } else { (Get-Location).Path }
$worktree = if ($env:CODEX_WORKTREE_PATH) { $env:CODEX_WORKTREE_PATH } else { (Get-Location).Path }

Write-Host "CODEX_SOURCE_TREE_PATH=$source"
Write-Host "CODEX_WORKTREE_PATH=$worktree"

Set-Location $worktree

dotnet --info

if (Test-Path "QuickShell.sln") {
    dotnet restore QuickShell.sln
}
else {
    throw "QuickShell.sln not found in worktree: $worktree"
}

if (Test-Path "QuickShell.Raycast/package.json") {
    Push-Location "QuickShell.Raycast"
    try {
        node --version
        npm --version
        npm ci
    }
    finally {
        Pop-Location
    }
}'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
$ErrorActionPreference = "Continue"

$root = if ($env:CODEX_WORKTREE_PATH) { $env:CODEX_WORKTREE_PATH } else { (Get-Location).Path }

Write-Host "Cleanup root: $root"
Set-Location $root

# Stop local dev processes that may hold file locks.
$processNames = @(
    "dotnet",
    "msbuild",
    "VBCSCompiler",
    "node",
    "npm",
    "ray"
)

foreach ($name in $processNames) {
    Get-Process -Name $name -ErrorAction SilentlyContinue |
        Where-Object {
            $_.Path -and $_.Path.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)
        } |
        ForEach-Object {
            Write-Host "Stopping $($_.ProcessName) [$($_.Id)]"
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
        }
}

# Remove generated build/package output.
$paths = @(
    "QuickShell/bin",
    "QuickShell/obj",
    "QuickShell.Core/bin",
    "QuickShell.Core/obj",
    "QuickShell.Core.Tests/bin",
    "QuickShell.Core.Tests/obj",
    "QuickShell.Run/bin",
    "QuickShell.Run/obj",
    "QuickShell.Suggest/bin",
    "QuickShell.Suggest/obj",
    "QuickShell/AppPackages",
    "QuickShell.Raycast/dist",
    "QuickShell.Raycast/.raycast",
    "QuickShell.Raycast/coverage"
)

foreach ($path in $paths) {
    if (Test-Path $path) {
        Write-Host "Removing $path"
        Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
    }
}

# Optional: node_modules is large, but deleting it may make repeated tasks slower.
# Uncomment only if Codex storage pressure matters more than reuse speed.
# if (Test-Path "QuickShell.Raycast/node_modules") {
#     Write-Host "Removing QuickShell.Raycast/node_modules"
#     Remove-Item "QuickShell.Raycast/node_modules" -Recurse -Force -ErrorAction SilentlyContinue
# }

Write-Host "Cleanup complete."'''

[[actions]]
name = "Validate"
icon = "tool"
command = '''
# scripts/validate.ps1
$ErrorActionPreference = "Stop"

dotnet restore QuickShell.sln
dotnet build QuickShell.sln -c Release -p:Platform=x64 --verbosity minimal
dotnet test QuickShell.Core.Tests/QuickShell.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --verbosity minimal

Push-Location QuickShell.Raycast
try {
    npm ci
    npm test
    npm run lint
    npm run build
}
finally {
    Pop-Location
}'''
platform = "win32"

[[actions]]
name = "Build Debug x64"
icon = "debug"
command = "dotnet build QuickShell.sln -c Debug -p:Platform=x64 --verbosity minimal"
platform = "win32"

[[actions]]
name = "Test Core"
icon = "test"
command = "dotnet test QuickShell.Core.Tests/QuickShell.Core.Tests.csproj -c Debug -p:Platform=x64 --verbosity minimal"
platform = "win32"

[[actions]]
name = "Raycast Check"
icon = "test"
command = "pwsh -NoProfile -Command \"Push-Location QuickShell.Raycast; npm test; npm run lint; npm run build; Pop-Location\""
platform = "win32"

[[actions]]
