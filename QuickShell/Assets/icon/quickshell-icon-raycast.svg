<?xml version="1.0" encoding="UTF-8"?>
<!-- Raycast variant: red >_ prompt, white bolt (same lockup as quickshell-icon.svg) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Quick Shell icon (Raycast)">
  <title>Quick Shell (Raycast)</title>

  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="22%" r="85%">
      <stop offset="0%" stop-color="#1E2A30"/>
      <stop offset="55%" stop-color="#141C21"/>
      <stop offset="100%" stop-color="#0A0E11"/>
    </radialGradient>

    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9A"/>
      <stop offset="45%" stop-color="#FF5C5C"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>

    <filter id="promptGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#FF6B6B" flood-opacity="0.16"/>
    </filter>

    <linearGradient id="boltGrad" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F5F8FA"/>
      <stop offset="100%" stop-color="#AAB6C2"/>
    </linearGradient>

    <filter id="boltDepth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="-3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="48" fill="url(#bgGrad)"/>

  <g transform="translate(532 536) scale(10.33954) translate(-59.05 -53.7)">
    <g filter="url(#promptGlow)">
      <path fill="url(#promptGrad)" d="
        M 16.3 35.1
        C 14.3 35 13.8 32.9 13.9 31.5
          14 30.2 14.8 29.3 15.3 28.9
        L 24.7 21.7
        L 14.8 15.4
        C 13.7 14.4 13.4 11.6 14.8 10.5
          16.2 9.2 17.8 9.5 18.8 10.2
        L 31.3 19.3
        C 33.5 20.8 32.3 24.1 30.9 24.8
        L 17.7 34.6
        C 17.3 34.9 16.9 35.1 16.3 35.1
        Z"/>

      <path fill="url(#promptGrad)" d="
        M 57.1 34.6
        H 37.2
        C 35.5 34.6 34.4 35.3 34.4 37.2
        V 38.6
        C 34.4 40 35.2 41.1 36.9 41.1
        H 57.1
        C 58.8 41.1 59.6 40 59.6 38.6
        V 37.6
        C 59.6 35.9 58.8 34.6 57.1 34.6
        Z"/>
    </g>

    <polygon fill="url(#boltGrad)" filter="url(#boltDepth)" points="95.7,11.4 51.7,61.8 73.9,61.8 61.2,98.2 104.7,49.9 81.6,49.8"/>
  </g>
</svg>
