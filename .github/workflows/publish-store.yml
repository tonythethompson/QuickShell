name: Publish to Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.3.0)
        required: true
        type: string

permissions:
  contents: read

env:
  STORE_APP_ID: 9PC8S6LNRT3R

jobs:
  deploy:
    # Product releases only: v* tags. Skip GitHub pre-releases and run-v* Run-plugin releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'v')
      )
    runs-on: windows-latest

    steps:
      - name: Resolve tag
        id: meta
        shell: pwsh
        env:
          TAG_INPUT: ${{ inputs.tag }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Prefer env vars over ${{ }} interpolation so untrusted tag text stays data.
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = "$($env:TAG_INPUT)".Trim()
          } else {
            $tag = "$($env:RELEASE_TAG_NAME)".Trim()
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+\.\d+$') {
            throw "Tag '$tag' must match vX.Y.Z.W (for example v0.2.3.0)."
          }

          $version = $tag.Substring(1)
          "TAG=$tag" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Store publish tag=$tag version=$version"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.TAG }}

      # The Store CLI runs on the .NET 9 Desktop Runtime; Quick Shell builds with .NET 10.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install MSStore CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.Store.CLI
          Join-Path $env:USERPROFILE '.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify version matches tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.VERSION }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION

          [xml]$manifest = Get-Content QuickShell/Package.appxmanifest
          $manifestVersion = [string]$manifest.Package.Identity.Version
          if ($manifestVersion -ne $releaseVersion) {
            throw "Release tag version ($releaseVersion) does not match Package.appxmanifest ($manifestVersion)."
          }

          [xml]$props = Get-Content Directory.Build.props
          $appVersion = [string]($props.Project.PropertyGroup.AppVersion | Select-Object -First 1)
          if ($appVersion -ne $releaseVersion) {
            throw "Release tag version ($releaseVersion) does not match Directory.Build.props AppVersion ($appVersion)."
          }

          Write-Host "Version gate OK: $releaseVersion"

      - name: Extract changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.VERSION }}
        run: |
          $notes = & .\scripts\extract-changelog.ps1 -Version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $notes | Set-Content -Path store-release-notes.txt -Encoding utf8
          Write-Host "Extracted $($notes.Length) characters of release notes."

      - name: Build Store upload package
        shell: pwsh
        run: .\scripts\build-store.ps1

      - name: Configure MSStore CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.MSSTORE_TENANT_ID }}" `
            --sellerId "${{ secrets.MSSTORE_SELLER_ID }}" `
            --clientId "${{ secrets.MSSTORE_CLIENT_ID }}" `
            --clientSecret "${{ secrets.MSSTORE_CLIENT_SECRET }}"

      - name: Upload Store package (draft)
        shell: pwsh
        run: |
          $upload = Get-ChildItem QuickShell/AppPackages/Store -Recurse -Filter *.msixupload |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $upload) {
            throw 'Store upload package was not produced.'
          }

          Write-Host "Uploading $($upload.FullName) without committing..."
          msstore publish "$env:GITHUB_WORKSPACE\QuickShell" `
            --inputFile $upload.FullName `
            --appId ${{ env.STORE_APP_ID }} `
            --noCommit

      - name: Set Store What's new from CHANGELOG
        shell: pwsh
        run: |
          $notes = Get-Content -Raw store-release-notes.txt
          .\scripts\set-store-release-notes.ps1 `
            -AppId ${{ env.STORE_APP_ID }} `
            -ReleaseNotes $notes

      - name: Commit Store submission
        shell: pwsh
        run: |
          msstore submission publish ${{ env.STORE_APP_ID }}
          Write-Host 'Submission committed. Certification is asynchronous.'
