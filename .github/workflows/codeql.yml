name: CodeQL

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C# with CodeQL
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Restore solution
        run: dotnet restore QuickShell.sln --verbosity minimal
        shell: pwsh

      - name: Build solution
        run: dotnet build QuickShell.sln -c Release -p:Platform=x64 --no-restore --verbosity minimal
        shell: pwsh

      - name: Test core project
        run: dotnet test QuickShell.Core.Tests/QuickShell.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --verbosity minimal
        shell: pwsh

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
