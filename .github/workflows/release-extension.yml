name: Release WinGet installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version number (leave empty to use AppxPackageVersion from csproj)
        required: false
        type: string
      release_notes:
        description: Optional notes override (leave empty to use CHANGELOG.md for this version)
        required: false
        default: ''
        type: string
      submit_winget:
        description: Open a WinGet manifest update PR after release
        required: false
        default: true
        type: boolean

env:
  DISPLAY_NAME: Quick Shell
  EXTENSION_NAME: QuickShell
  GITHUB_REPO_URL: https://github.com/tonythethompson/QuickShell
  WINGET_PACKAGE_ID: tonythethompson.QuickShell
  WINGET_CMDPAL_PACKAGE_ID: tonythethompson.QuickShellforCmdPal
  WINGET_RUN_PACKAGE_ID: tonythethompson.QuickShellforRun

# Default-deny workflow permissions. Jobs opt into only the scopes they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: v${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Get version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $version = "$($env:REF_NAME)" -replace '^v', ''
          } elseif (-not [string]::IsNullOrWhiteSpace($env:VERSION_INPUT)) {
            $version = "$($env:VERSION_INPUT)".Trim()
          } else {
            $projectFile = "QuickShell/QuickShell.csproj"
            $xml = [xml](Get-Content $projectFile)
            $version = $xml.Project.PropertyGroup.AppxPackageVersion | Select-Object -First 1
            if (-not $version) { throw "AppxPackageVersion not found in $projectFile" }
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Using version: $version"

      - name: Verify version files match
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $version = $env:RELEASE_VERSION

          [xml]$manifest = Get-Content QuickShell/Package.appxmanifest
          $manifestVersion = [string]$manifest.Package.Identity.Version
          if ($manifestVersion -ne $version) {
            throw "Release version ($version) does not match Package.appxmanifest ($manifestVersion)."
          }

          [xml]$props = Get-Content Directory.Build.props
          $appVersion = [string]($props.Project.PropertyGroup.AppVersion | Select-Object -First 1)
          if ($appVersion -ne $version) {
            throw "Release version ($version) does not match Directory.Build.props AppVersion ($appVersion)."
          }

      - name: Extract changelog
        id: changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          $version = $env:RELEASE_VERSION
          $override = "$($env:RELEASE_NOTES_INPUT)".Trim()

          if ($override) {
            $notes = $override
            Write-Host "Using workflow_dispatch release_notes override."
          } else {
            $notes = & .\scripts\extract-changelog.ps1 -Version $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          "NOTES<<EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          $notes | Set-Content -Path release-notes.txt -Encoding utf8

          $wingetId = "${{ env.WINGET_PACKAGE_ID }}"
          $wingetCmdPalId = "${{ env.WINGET_CMDPAL_PACKAGE_ID }}"
          $wingetRunId = "${{ env.WINGET_RUN_PACKAGE_ID }}"

          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("## Quick Shell v$version")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine($notes)
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("Package matrix: [docs/release-packages.md](https://github.com/tonythethompson/QuickShell/blob/master/docs/release-packages.md)")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## Install")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("### PowerToys: Command Palette + Run (bundled)")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("- **x64**: ``QuickShell-Setup-$version-x64.exe``")
          [void]$sb.AppendLine("- **ARM64**: ``QuickShell-Setup-$version-arm64.exe``")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("Restart PowerToys after install so Run picks up the plugin.")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("### PowerToys: Command Palette only (Store-equivalent)")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("- **x64**: ``QuickShellforCmdPal-Setup-$version-x64.exe``")
          [void]$sb.AppendLine("- **ARM64**: ``QuickShellforCmdPal-Setup-$version-arm64.exe``")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("### PowerToys: Run plugin only")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("- **x64**: ``QuickShellforRun-Setup-$version-x64.exe``")
          [void]$sb.AppendLine("- **ARM64**: ``QuickShellforRun-Setup-$version-arm64.exe``")
          [void]$sb.AppendLine("- **ZIP**: ``QuickShell.Run-x64.zip`` / ``QuickShell.Run-ARM64.zip``")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("### Raycast")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("Install **Quick Shell** from the [Raycast Store](https://www.raycast.com/store) (Windows and macOS). GitHub Releases do not ship Raycast sideload packages.")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("After installing the Command Palette extension, run **Reload Command Palette Extension** in PowerToys Command Palette.")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## WinGet")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine('```powershell')
          [void]$sb.AppendLine("winget install $wingetId              # CmdPal + Run")
          [void]$sb.AppendLine("winget install $wingetCmdPalId       # CmdPal only")
          [void]$sb.AppendLine("winget install $wingetRunId          # Run only")
          [void]$sb.AppendLine('```')

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'release-body.md'),
            $sb.ToString(),
            [System.Text.UTF8Encoding]::new($false))
          Write-Host "Wrote release-body.md ($($notes.Length) chars of notes)."

      - name: Build EXE installers (CmdPal variants)
        run: |
          Set-Location QuickShell
          .\build-exe.ps1 -Version "${{ steps.version.outputs.VERSION }}"
        shell: pwsh

      - name: Build PowerToys Run plugin (x64)
        run: .\scripts\build-run-plugin.ps1 -Platform x64
        shell: pwsh

      - name: Build PowerToys Run plugin (ARM64)
        run: .\scripts\build-run-plugin.ps1 -Platform ARM64
        shell: pwsh

      - name: Build PowerToys Run standalone installers
        run: .\scripts\build-run-installer.ps1 -Version "${{ steps.version.outputs.VERSION }}"
        shell: pwsh

      - name: Verify release artifacts
        run: .\scripts\verify-release-artifacts.ps1 -Version "${{ steps.version.outputs.VERSION }}"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Quick Shell v${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body_path: release-body.md
          files: |
            QuickShell/bin/Release/installer/*.exe
            QuickShell.Run/bin/Release/installer/*.exe
            QuickShell.Run/bin/x64/Release/QuickShell.Run-x64.zip
            QuickShell.Run/bin/ARM64/Release/QuickShell.Run-ARM64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget-update:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    if: >-
      needs.build.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event.inputs.submit_winget != 'false'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Load release notes from CHANGELOG
        id: changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          $override = "$($env:RELEASE_NOTES_INPUT)".Trim()
          if ($override) {
            $notes = $override
          } else {
            $notes = & .\scripts\extract-changelog.ps1 -Version $env:RELEASE_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $notes | Set-Content -Path release-notes.txt -Encoding utf8
          Write-Host "Loaded $($notes.Length) characters of WinGet release notes."

      - name: Install WingetCreate
        run: |
          winget install --id Microsoft.WingetCreate -e --source winget `
            --accept-source-agreements --accept-package-agreements --disable-interactivity
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + `
            [System.Environment]::GetEnvironmentVariable('Path', 'User')
          # WingetCreate 1.12.x: `version` exits 1 / prints help; `info` is the reliable probe.
          if (-not (Get-Command wingetcreate -ErrorAction SilentlyContinue)) {
            throw 'wingetcreate was not found on PATH after install.'
          }
          wingetcreate info
        shell: pwsh

      - name: Submit WinGet manifest update (PowerToys bundled)
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + `
            [System.Environment]::GetEnvironmentVariable('Path', 'User')

          if (-not $env:WINGET_PAT) {
            Write-Warning "WINGET_PAT secret is not configured. Skipping WinGet submission."
            exit 0
          }

          $version = "${{ needs.build.outputs.version }}"
          $tag = "${{ needs.build.outputs.tag }}"
          $packageId = "${{ env.WINGET_PACKAGE_ID }}"
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $x64Url = "$baseUrl/QuickShell-Setup-$version-x64.exe"
          $arm64Url = "$baseUrl/QuickShell-Setup-$version-arm64.exe"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $outDir = "winget-out/$packageId"
          $notes = Get-Content -Raw release-notes.txt

          wingetcreate update $packageId `
            --version $version `
            --urls $x64Url $arm64Url `
            --release-notes-url $releaseNotesUrl `
            --out $outDir

          .\scripts\set-winget-release-notes.ps1 -ManifestDir $outDir -ReleaseNotes $notes

          wingetcreate submit `
            --prtitle "$packageId version $version" `
            --token $env:WINGET_PAT `
            $outDir
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}

      - name: Submit WinGet manifest update (CmdPal only)
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + `
            [System.Environment]::GetEnvironmentVariable('Path', 'User')

          if (-not $env:WINGET_PAT) { exit 0 }

          $version = "${{ needs.build.outputs.version }}"
          $tag = "${{ needs.build.outputs.tag }}"
          $packageId = "${{ env.WINGET_CMDPAL_PACKAGE_ID }}"
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $x64Url = "$baseUrl/QuickShellforCmdPal-Setup-$version-x64.exe"
          $arm64Url = "$baseUrl/QuickShellforCmdPal-Setup-$version-arm64.exe"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $outDir = "winget-out/$packageId"
          $notes = Get-Content -Raw release-notes.txt

          wingetcreate update $packageId `
            --version $version `
            --urls $x64Url $arm64Url `
            --release-notes-url $releaseNotesUrl `
            --out $outDir

          .\scripts\set-winget-release-notes.ps1 -ManifestDir $outDir -ReleaseNotes $notes

          wingetcreate submit `
            --prtitle "$packageId version $version" `
            --token $env:WINGET_PAT `
            $outDir
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}

      - name: Submit WinGet manifest update (Run only)
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + `
            [System.Environment]::GetEnvironmentVariable('Path', 'User')

          if (-not $env:WINGET_PAT) { exit 0 }

          $version = "${{ needs.build.outputs.version }}"
          $tag = "${{ needs.build.outputs.tag }}"
          $packageId = "${{ env.WINGET_RUN_PACKAGE_ID }}"
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $x64Url = "$baseUrl/QuickShellforRun-Setup-$version-x64.exe"
          $arm64Url = "$baseUrl/QuickShellforRun-Setup-$version-arm64.exe"
          $releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $outDir = "winget-out/$packageId"
          $notes = Get-Content -Raw release-notes.txt

          wingetcreate update $packageId `
            --version $version `
            --urls $x64Url $arm64Url `
            --release-notes-url $releaseNotesUrl `
            --out $outDir

          .\scripts\set-winget-release-notes.ps1 -ManifestDir $outDir -ReleaseNotes $notes

          wingetcreate submit `
            --prtitle "$packageId version $version" `
            --token $env:WINGET_PAT `
            $outDir
        shell: pwsh
        continue-on-error: true
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
